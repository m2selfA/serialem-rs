name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Regenerate pinned API
        run: cargo run --quiet --bin generate_api -- vendor/serialem/MacroMasterList.h docs/api-matrix.csv docs/api-matrix.md src/generated/command_ids.rs src/generated/commands.rs vendor/serialem/provenance.toml

      - name: Reject stale generated files
        run: git diff --exit-code -- docs/api-matrix.csv docs/api-matrix.md src/generated/command_ids.rs src/generated/commands.rs

      - name: Check
        run: cargo check --all-targets --all-features

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Documentation tests
        run: cargo test --doc --all-features

      - name: Package with lockfile
        run: cargo package --locked

      - name: Audit package contents
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(cargo package --locked --list)
          grep -F $'vendor/serialem/MacroMasterList.h' <<< "$manifest"
          grep -F $'vendor/serialem/Copyright.txt' <<< "$manifest"
          grep -F $'vendor/serialem/ReadMe.txt' <<< "$manifest"
          grep -F $'assets/windows/SerialEM.ico' <<< "$manifest"
          grep -F $'assets/windows/SerialEMDoc.ico' <<< "$manifest"
          ! grep -F $'/.pi/' <<< "$manifest"

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check whitespace
        run: git diff --check
